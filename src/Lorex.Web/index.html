<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- PNG rather than SVG: the mark is the owner's raster artwork, and tracing it into
         vectors would be redrawing it. Three sizes so the browser picks rather than
         downsamples - at 16px the rings are already at the edge of legibility. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) meaningful, which the
         bottom action bars on narrow screens rely on. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- The browser chrome continues the surface the app is painting: the paper in Light, the
         plate in Dark. The bootstrap below sets it for the theme in use. -->
    <meta name="theme-color" content="#f6f2ea" />

    <!-- The theme, before anything is drawn (013). One Lorex theme for the portal and the
         workspace: the choice saved in this browser, else the system's. Inline and first so
         no page paints in one theme and then flips; lib/theme.ts owns it afterwards and uses
         the same key and colours. Outside the lorex:head block, so the server's per-page head
         never touches it. -->
    <script>
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('lorex-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        var root = document.documentElement
        root.setAttribute('data-theme', theme)
        root.style.colorScheme = theme
        var chrome = document.querySelector('meta[name="theme-color"]')
        if (chrome) chrome.setAttribute('content', theme === 'dark' ? '#151617' : '#f6f2ea')
      })()
    </script>

    <!-- The launch layer (043.5): an installed Lorex opens on black with the logo resolving into view, then lifts to
         reveal the app, which has been starting underneath all along. Only in the installed app, and once per window:
         a browser tab and a reload in the same window start as they always have. Decided here, before the first paint,
         so the platform's black launch screen, this layer and the logo are one surface. src/lib/launch.ts lifts it once
         the shell has drawn something real; the failsafe animation lifts it anyway if the app never starts. -->
    <script>
      ;(function () {
        var installed =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true
        if (!installed) return
        try {
          if (sessionStorage.getItem('lorex-launched')) return
          sessionStorage.setItem('lorex-launched', '1')
        } catch (e) {}
        document.documentElement.setAttribute('data-launch', 'on')
        var chrome = document.querySelector('meta[name="theme-color"]')
        if (chrome) chrome.setAttribute('content', '#000000')
        var logo = document.createElement('link')
        logo.rel = 'preload'
        logo.as = 'image'
        logo.href = '/launch-logo.webp'
        document.head.appendChild(logo)
      })()
    </script>
    <style>
      .launch {
        display: none;
      }
      html[data-launch='on'] {
        background: #000;
      }
      html[data-launch] .launch {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: #000;
        animation: launch-failsafe 0.3s linear 10s forwards;
      }
      .launch__logo {
        width: min(78vw, 560px, 110vh);
        aspect-ratio: 2 / 1;
        background: url('/launch-logo.webp') center / contain no-repeat;
        opacity: 0;
        transform: scale(0.965);
        filter: saturate(0.35) brightness(0.75);
        animation: launch-logo 480ms cubic-bezier(0.2, 0.7, 0.2, 1) 60ms forwards;
      }
      html[data-launch='leaving'] .launch {
        pointer-events: none;
        animation: launch-leave 380ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes launch-logo {
        to {
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
      @keyframes launch-leave {
        to {
          opacity: 0;
          transform: translateY(6vh);
        }
      }
      @keyframes launch-failsafe {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @keyframes launch-fade-in {
        to {
          opacity: 1;
        }
      }
      @keyframes launch-fade-out {
        to {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .launch__logo {
          transform: none;
          filter: none;
          animation: launch-fade-in 160ms linear forwards;
        }
        html[data-launch='leaving'] .launch {
          animation: launch-fade-out 160ms linear forwards;
        }
      }
    </style>

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lorex" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- The server replaces everything between these two markers with each page's own head -
         title, description, robots, canonical, Open Graph (ADR 0038). What stays here is the head
         for anything served without that step: the dev server, and /index.html itself. -->
    <!-- lorex:head -->
    <title>Lorex</title>
    <meta
      name="description"
      content="A workroom for the worlds you keep: their people, places, history and the rules that hold them together."
    />
    <meta name="robots" content="noindex,nofollow" />
    <!-- /lorex:head -->
  </head>
  <body>
    <div class="launch" id="launch" aria-hidden="true" data-testid="launch">
      <div class="launch__logo"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
