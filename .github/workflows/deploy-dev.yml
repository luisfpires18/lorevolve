# Deploys the DEV environment. Only from dev, only to the one DEV App Service, and only after
# the same validation a pull request gets.
#
# Nothing here is a credential. Sign-in is OIDC federated identity, so the four Azure values are
# repository or environment variables - identifiers, not secrets - and there is nothing here to
# leak or rotate. The exact names an owner has to create are in docs/deployment/azure-dev.md.
name: Deploy DEV

on:
  push:
    branches: [dev]
    # The alpha page (site/) is deployed by Cloudflare Pages, not here. A push that touches only
    # site/ skips the app redeploy; a push that also changes anything else deploys as usual.
    paths-ignore:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  # The deployable is built while validation runs rather than after it, so the deployment itself
  # is only sign-in, upload and the health check. Nothing leaves this job but an artifact: Deploy
  # still needs validate, so an unvalidated build is never published.
  package:
    name: Package
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/LorEvolve.Web/package-lock.json

      # One process serves both halves, so the built client is copied into the API's wwwroot
      # before publish. wwwroot is build output and is not in the repository.
      #
      # LOREVOLVE_DEV_RUN makes the shown version this run's DEV patch (src/LorEvolve.Web/devVersion.ts):
      # it rises with every run and stays the same on a re-run. The build id names the service
      # worker's cache, so it carries the attempt too: every build, re-runs included, starts clean.
      # Re-running only a failed Deploy reuses this attempt's package, and with it its build id:
      # the same bytes under the same cache name.
      - name: Build the client
        working-directory: src/LorEvolve.Web
        env:
          LOREVOLVE_DEV_RUN: ${{ github.run_number }}
          LOREVOLVE_BUILD_ID: dev-${{ github.run_number }}.${{ github.run_attempt }}-${{ github.sha }}
        run: |
          npm ci
          npm run build

      - name: Copy the client into wwwroot
        run: |
          rm -rf src/LorEvolve.Api/wwwroot
          mkdir -p src/LorEvolve.Api/wwwroot
          cp -r src/LorEvolve.Web/dist/. src/LorEvolve.Api/wwwroot/

      # The same -dev version the client shows (devVersion.ts), so /api/health reads it too.
      - name: Publish the API
        env:
          LOREVOLVE_DEV_RUN: ${{ github.run_number }}
        run: |
          version=$(node -e "import('./src/LorEvolve.Web/devVersion.ts').then(m => console.log(m.displayVersion(require('./src/LorEvolve.Web/package.json').version, process.env.LOREVOLVE_DEV_RUN)))")
          dotnet publish src/LorEvolve.Api -c Release -o publish -p:Version="$version"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-package
          path: publish
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: [validate, package]
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dev-package
          path: publish

      # type: ZIP below takes a .zip file, not a folder.
      - name: Zip the package
        run: cd publish && zip -qr ../publish.zip .

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish.zip
          # Replace the site, not add to it: without this every deploy left its hashed bundles and source maps
          # behind, and on the Free plan's 1 GB they filled /home - the database's disk too - by October 2026.
          type: ZIP
          clean: true

      # A deployment that answers is the only proof worth having. The wait is for the platform
      # to finish swapping in the new site, not for anything inside the app: LorEvolve applies its
      # migrations during startup and does not report healthy before they are done.
      - name: Check that DEV answers
        env:
          HEALTH_URL: ${{ steps.deploy.outputs.webapp-url }}/health
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$HEALTH_URL" || echo 000)
            echo "attempt $attempt: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "DEV did not answer 200 at $HEALTH_URL"
          exit 1

      - name: Sign out of Azure
        if: always()
        run: az logout || true
