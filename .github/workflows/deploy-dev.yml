# Deploys the DEV environment. Only from dev, only to the one DEV App Service, and only after
# the same validation a pull request gets.
#
# Nothing here is a credential. Sign-in is OIDC federated identity, so the four Azure values are
# repository or environment variables - identifiers, not secrets - and there is nothing here to
# leak or rotate. The exact names an owner has to create are in docs/deployment/azure-dev.md.
name: Deploy DEV

on:
  push:
    branches: [dev]
    # The alpha page (site/) is deployed by Cloudflare Pages, not here. A push that touches only
    # site/ skips the app redeploy; a push that also changes anything else deploys as usual.
    paths-ignore:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  # The deployable is built while validation runs rather than after it, so the deployment itself
  # is only sign-in, upload and the health check. Nothing leaves this job but an artifact: Deploy
  # still needs validate, so an unvalidated build is never published.
  package:
    name: Package
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/LorEvolve.Web/package-lock.json

      # One process serves both halves, so the built client is copied into the API's wwwroot
      # before publish. wwwroot is build output and is not in the repository.
      #
      # LOREVOLVE_DEV_RUN makes the shown version this run's DEV patch (src/LorEvolve.Web/devVersion.ts):
      # it rises with every run and stays the same on a re-run. The build id names the service
      # worker's cache, so it carries the attempt too: every build, re-runs included, starts clean.
      # Re-running only a failed Deploy reuses this attempt's package, and with it its build id:
      # the same bytes under the same cache name.
      - name: Build the client
        working-directory: src/LorEvolve.Web
        env:
          LOREVOLVE_DEV_RUN: ${{ github.run_number }}
          LOREVOLVE_BUILD_ID: dev-${{ github.run_number }}.${{ github.run_attempt }}-${{ github.sha }}
        run: |
          npm ci
          npm run build

      - name: Copy the client into wwwroot
        run: |
          rm -rf src/LorEvolve.Api/wwwroot
          mkdir -p src/LorEvolve.Api/wwwroot
          cp -r src/LorEvolve.Web/dist/. src/LorEvolve.Api/wwwroot/

      # The same -dev version the client shows (devVersion.ts), so /api/health reads it too.
      - name: Publish the API
        env:
          LOREVOLVE_DEV_RUN: ${{ github.run_number }}
        run: |
          version=$(node -e "import('./src/LorEvolve.Web/devVersion.ts').then(m => console.log(m.displayVersion(require('./src/LorEvolve.Web/package.json').version, process.env.LOREVOLVE_DEV_RUN)))")
          dotnet publish src/LorEvolve.Api -c Release -o publish -p:Version="$version"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-package
          path: publish
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: [validate, package]
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dev-package
          path: publish

      # type: ZIP below takes a .zip file, not a folder.
      - name: Zip the package
        run: cd publish && zip -qr ../publish.zip .

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # With WEBSITE_RUN_FROM_PACKAGE=1 the ZIP is mounted read-only as wwwroot and only a restarted process sees it, so
      # nothing serves from a mix of old and new assemblies. Without it the upload swaps files under the running process:
      # on 2026-10-29 and 2026-10-30 that threw BadImageFormatException until a restart. Setting it is an owner step.
      - name: Read the app's settings
        env:
          APP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          id=$(az resource list --name "$APP" --resource-type Microsoft.Web/sites --query '[0].id' -o tsv)
          rfp=$(az webapp config appsettings list -g "$(echo "$id" | cut -d/ -f5)" -n "$APP" --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value | [0]" -o tsv)
          echo "APP_ID=$id" >> "$GITHUB_ENV"
          echo "RUN_FROM_PACKAGE=$rfp" >> "$GITHUB_ENV"
          [ "$rfp" = "1" ] || echo "::warning::WEBSITE_RUN_FROM_PACKAGE is not 1 on $APP: the deploy swaps files under the running process. See docs/deployment/azure-dev.md"

      # Health below accepts only a process started after this moment.
      - name: Mark the deploy start
        run: echo "DEPLOY_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish.zip
          # Replace the site, not add to it: without this every deploy left its hashed bundles and source maps
          # behind, and on the Free plan's 1 GB they filled /home - the database's disk too - by October 2026.
          type: ZIP
          clean: true

      # Without run-from-package the old process keeps serving from swapped files, so restart it outright. With it, the
      # deploy restarts the app to mount the new package and a second restart would only lengthen the outage.
      - name: Restart the app
        if: env.RUN_FROM_PACKAGE != '1'
        run: az webapp restart --ids "$APP_ID"

      # A release is good only once the new process answers. az webapp restart returns at once, and on 2026-10-30 the old
      # process passed this check while the new container took nine minutes to come up, so 200 alone proves nothing:
      # wait for /api/health's startedUtc to be later than the deploy start. LorEvolve applies its migrations during
      # startup and does not answer before they are done. /api/health, not /health: on 2026-10-29 /health answered 200
      # while every /api route failed.
      - name: Check that DEV answers from the new process
        env:
          HEALTH_URL: ${{ steps.deploy.outputs.webapp-url }}/api/health
        run: |
          deadline=$(( $(date -u +%s) + 720 ))
          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            started=$(curl -sS -f --max-time 10 "$HEALTH_URL" | jq -r '.startedUtc // empty' || true)
            if [ -n "$started" ] && [ "$(date -u -d "$started" +%s)" -gt "$DEPLOY_STARTED" ]; then
              echo "new process answers, started $started"
              exit 0
            fi
            echo "$(date -u +%T): ${started:-no answer}, want a process started after $(date -u -d "@$DEPLOY_STARTED" +%T)"
            sleep 15
          done
          echo "::error::DEV did not answer from a process started after the deploy within 12 minutes at $HEALTH_URL"
          exit 1

      - name: Sign out of Azure
        if: always()
        run: az logout || true
