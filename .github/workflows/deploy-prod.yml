# Deploys PROD (lorevolve.com). Only by hand, only from master, only to the one PROD App Service,
# and only after the same validation a pull request gets. A release is: merge dev into master, then
# run this workflow. Pushing to master deploys nothing.
#
# Same shape as deploy-dev.yml on purpose; the differences are the trigger, the branch, the
# environment (prod, whose variables name the PROD app) and the shown version: PROD builds without
# LOREVOLVE_DEV_RUN, so it shows package.json's version unchanged. Nothing here is a credential:
# sign-in is OIDC federated identity (docs/deployment/azure-prod.md).
name: Deploy PROD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  # The deployable is built while validation runs rather than after it, so the deployment itself
  # is only sign-in, upload and the health check. Nothing leaves this job but an artifact: Deploy
  # still needs validate, so an unvalidated build is never published.
  package:
    name: Package
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/LorEvolve.Web/package-lock.json

      # One process serves both halves, so the built client is copied into the API's wwwroot
      # before publish. No LOREVOLVE_DEV_RUN: the shown version is package.json's. The build id
      # names the service worker's cache, so every build, re-runs included, starts clean.
      - name: Build the client
        working-directory: src/LorEvolve.Web
        env:
          LOREVOLVE_BUILD_ID: prod-${{ github.run_number }}.${{ github.run_attempt }}-${{ github.sha }}
        run: |
          npm ci
          npm run build

      - name: Copy the client into wwwroot
        run: |
          rm -rf src/LorEvolve.Api/wwwroot
          mkdir -p src/LorEvolve.Api/wwwroot
          cp -r src/LorEvolve.Web/dist/. src/LorEvolve.Api/wwwroot/

      - name: Publish the API
        run: dotnet publish src/LorEvolve.Api -c Release -o publish

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prod-package
          path: publish
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: [validate, package]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prod-package
          path: publish

      # type: ZIP below takes a .zip file, not a folder.
      - name: Zip the package
        run: cd publish && zip -qr ../publish.zip .

      - name: Check the target is set
        env:
          APP: ${{ vars.AZURE_PROD_WEBAPP_NAME }}
        run: test -n "$APP" || { echo "AZURE_PROD_WEBAPP_NAME is not set on the prod environment"; exit 1; }

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          # Its own variable, not AZURE_WEBAPP_NAME: that one is a repository variable naming DEV, and a
          # prod environment that forgot to override it would deploy PROD's build onto DEV. Unset, this fails.
          app-name: ${{ vars.AZURE_PROD_WEBAPP_NAME }}
          package: publish.zip
          # Replace the site, not add to it: old hashed bundles otherwise pile up on /home, the database's disk.
          type: ZIP
          clean: true

      # A ZIP deploy swaps files under the running process. On 2026-10-29 PROD went on serving from a mix of old and
      # new assemblies (BadImageFormatException on every /api request) until it was restarted, so restart it outright.
      - name: Restart the app
        env:
          APP: ${{ vars.AZURE_PROD_WEBAPP_NAME }}
        run: az webapp restart --ids "$(az resource list --name "$APP" --resource-type Microsoft.Web/sites --query '[0].id' -o tsv)"

      # LorEvolve applies its migrations during startup and does not report healthy before they are done.
      # /api/health, not /health: on 2026-10-29 /health answered 200 while every /api route failed.
      - name: Check that PROD answers
        env:
          HEALTH_URL: ${{ steps.deploy.outputs.webapp-url }}/api/health
        run: |
          for attempt in $(seq 1 20); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$HEALTH_URL" || echo 000)
            echo "attempt $attempt: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "PROD did not answer 200 at $HEALTH_URL"
          exit 1

      - name: Sign out of Azure
        if: always()
        run: az logout || true
