# Weekly, grouped, so updates arrive as a few reviewable PRs into dev rather than one per package.
# ImageSharp is held at 3.1.x until the licensed upgrade (#33 M-1, issue #51): 3.2 and 4.x both refuse a
# build without a Six Labors license key. Patches still come through.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
    ignore:
      - dependency-name: SixLabors.ImageSharp
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: npm
    directory: /src/LorEvolve.Web
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /tests/LorEvolve.E2E
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      e2e:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
